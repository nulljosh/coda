name: QuotableWatch
options:
  bundleIdPrefix: com.heyitsmejosh
  deploymentTarget:
    watchOS: "10.0"
settings:
  DEVELOPMENT_TEAM: QMM486NPYC
  SWIFT_VERSION: "6.0"
  MARKETING_VERSION: "1.0.0"
  CURRENT_PROJECT_VERSION: "1"
  CODE_SIGN_STYLE: Automatic
targets:
  QuotableWatch:
    type: application
    platform: watchOS
    sources:
      - ContentView.swift
      - QuotableWatchApp.swift
      - Models
      - Views
      - Assets.xcassets
      - path: ../ios/Quotable/Quote.swift
        group: Shared
      - path: ../ios/Quotable/Daily.swift
        group: Shared
      - path: ../quotes.json
        group: Shared
        buildPhase: resources
    settings:
      INFOPLIST_FILE: ""
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_WKWatchOnly: YES
      PRODUCT_BUNDLE_IDENTIFIER: com.heyitsmejosh.quotable.watchos
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      PRODUCT_NAME: Quotable
      CODE_SIGN_ENTITLEMENTS: QuotableWatch.entitlements
